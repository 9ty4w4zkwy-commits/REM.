<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REM – Test Laboratorio 1.0</title><style>body{margin:0;background:#101a2a;color:#fff;font:16px system-ui}#status{padding:32px;text-align:center}</style></head><body><div id="status">Caricamento REM – Laboratorio 1.0…</div><script>
(async()=>{
try{
 const response=await fetch('./REM_Iterazione3_Focus_Mode.html',{cache:'no-store'});
 if(!response.ok)throw Error('File base non disponibile ('+response.status+')');
 let html=await response.text();
 const original=html;
 html=html.replace('</head>','<link rel="stylesheet" href="./lab/styles/legacy-overrides.css"></head>');
 const oldOpen="window.REMCatalogo?.apri(id,'ebook')};card.append";
 const newOpen="window.REMCatalogo?.apri(id,'ebook');window.REM_OPEN_FROM_START?.()};card.append";
 if(!html.includes(oldOpen))throw Error('Pulsante Scopri il libro non trovato');
 html=html.replace(oldOpen,newOpen);
 const oldRating="function askRating(id){ratingId=id;document.getElementById('remRatingTitle').textContent='Quanto ti è piaciuto «'+titles[id]+'»?';stars.replaceChildren();for(let n=1;n<=5;n++){let b=document.createElement('button');b.type='button';b.textContent='☆';b.setAttribute('aria-label',n+' stelle su 5');b.onclick=()=>{record(id).rating=n;save();overlay.hidden=true;render();};stars.append(b)}overlay.hidden=false}";
 const newRating="function askRating(id){ratingId=id;document.getElementById('remRatingTitle').textContent='Quanto ti è piaciuto «'+titles[id]+'»?';stars.replaceChildren();const current=record(id).rating||0;let selectedRating=current;window.REM_PENDING_RATING=()=>({id,value:selectedRating});function paint(value){[...stars.children].forEach((b,i)=>{const full=i<value;b.textContent=full?'★':'☆';b.setAttribute('aria-pressed',String(full));b.style.color=full?'#64DFA9':'#a3b8c8'})}for(let n=1;n<=5;n++){const b=document.createElement('button');b.type='button';b.textContent='☆';b.setAttribute('aria-label',n+' stelle su 5');b.style.touchAction='manipulation';b.onclick=(event)=>{event.preventDefault();event.stopPropagation();selectedRating=selectedRating===n?n-1:n;paint(selectedRating)};stars.append(b)}paint(current);overlay.hidden=false}";
 if(!html.includes(oldRating))throw Error('Feedback originale non trovato');
 html=html.replace(oldRating,newRating);
 html=html.replace("document.getElementById('remRatingLater').onclick=()=>overlay.hidden=true;","document.getElementById('remRatingLater').textContent='Non ora';document.getElementById('remRatingLater').onclick=()=>{overlay.hidden=true;window.REM_PENDING_RATING=null};const submit=document.createElement('button');submit.type='button';submit.textContent='Invia';submit.className='rem-rating-submit';submit.onclick=()=>{const pending=window.REM_PENDING_RATING?.();if(!pending||pending.value<1)return;record(pending.id).rating=pending.value;save();render();overlay.hidden=true;window.REM_PENDING_RATING=null};document.getElementById('remRatingLater').insertAdjacentElement('beforebegin',submit);");
 const startFn=`<script>window.REM_OPEN_FROM_START=function(){try{select(0,false)}catch(e){}const reader=document.getElementById('reader');if(reader)reader.scrollTop=0;requestAnimationFrame(()=>{const heading=reader?.querySelector('h2');if(heading)heading.scrollIntoView({block:'start',behavior:'instant'})})};<\/script>`;
 html=html.replace('</body>',startFn+'<script src="./lab/modules/cover.js"><\/script><script src="./lab/modules/focus-timer.js"><\/script></body>');
 if(html===original)throw Error('Nessuna correzione applicata');
 document.open();document.write(html);document.close();
 const epScript=document.createElement('script');epScript.src='./rem-episodi-v5-6.js?v=1';epScript.onerror=()=>console.error('REM episodi: script non caricato');document.body.appendChild(epScript);
}catch(e){document.getElementById('status').textContent='Impossibile avviare il test: '+e.message;}
})();
</script></body></html>
