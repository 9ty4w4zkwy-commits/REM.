<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REM · Demo modulare</title><link rel="stylesheet" href="./lab/styles/app.css"></head><body><header><h1>REM <small style="font-size:.6em">Demo modulare</small></h1><button id="goSettings">Aspetto</button></header><main><p id="status" class="status" role="status">Caricamento…</p><section id="library"><h2>Biblioteca</h2><p class="muted">I titoli sono letti dal catalogo JSON, non inseriti nell'interfaccia.</p><div id="books"></div></section><section id="reader" class="hidden"><button id="goLibrary">← Biblioteca</button><h2 id="bookTitle"></h2><label for="chapter">Capitolo</label><select id="chapter"></select><label for="format">Formato</label><select id="format"><option value="ebook">Ebook</option><option value="audio">Audiolibro</option><option value="paper">Cartaceo</option></select><article class="panel"><h3 id="chapterTitle"></h3><div id="chapterText" class="reader"></div><div id="audio"></div><p id="source" class="status"></p></article><div class="panel"><h3>Focus Mode · timer dimostrativo</h3><label for="minutes">Durata</label><select id="minutes"><option value="5">5 minuti</option><option value="10">10 minuti</option><option value="25">25 minuti</option></select><p id="clock" aria-live="off">00:00</p><div class="tabs"><button id="timerStart">Avvia</button><button id="timerPause">Pausa</button><button id="timerReset">Azzera</button></div></div></section><section id="settings" class="hidden"><button id="goBack">← Biblioteca</button><h2>Aspetto</h2><p>Questa schermata dimostra come cambiare un parametro visivo senza intervenire nella logica.</p><label for="theme">Colore di accento</label><select id="theme"><option value="#64dfa9">Menta</option><option value="#f2bb62">Ambra</option><option value="#b6a5ff">Lavanda</option></select></section></main><script src="./lab/modules/app-core.js" defer></script></body></html>
