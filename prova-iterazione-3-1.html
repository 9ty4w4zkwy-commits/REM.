<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REM – Test Iterazione 3.1</title><style>body{margin:0;background:#101a2a;color:#fff;font:16px system-ui}#status{padding:32px;text-align:center}</style></head><body><div id="status">Caricamento REM – Iterazione 3.1…</div><script>
(async()=>{
try{
 const response=await fetch('./REM_Iterazione3_Focus_Mode.html',{cache:'no-store'});
 if(!response.ok)throw Error('File base non disponibile ('+response.status+')');
 let html=await response.text();
 const original=html;
 html=html.replace('</head>',`<style>
 #homeFree .home-book > img{width:100%!important;height:245px!important;object-fit:contain!important;object-position:center!important;padding:10px!important;box-sizing:border-box!important;background:#102b44!important}
 #homeFree .home-book{overflow:visible!important}
 #homeFree .home-book > strong{overflow-wrap:anywhere}
 .rem-rate-backdrop{z-index:2147483647!important;pointer-events:auto!important}
 .rem-rate-dialog,.rem-rate-stars,.rem-rate-stars button{pointer-events:auto!important}
 .rem-rate-stars button{min-width:43px;min-height:54px;touch-action:manipulation}
 .rem-rate-stars button[aria-pressed="true"]{color:#64DFA9!important}
 @media(max-width:420px){#homeFree .home-book > img{height:220px!important;padding:9px!important}}
 </style></head>`);
 const oldOpen="window.REMCatalogo?.apri(id,'ebook')};card.append";
 const newOpen="window.REMCatalogo?.apri(id,'ebook');window.REM_OPEN_FROM_START?.()};card.append";
 if(!html.includes(oldOpen))throw Error('Pulsante Scopri il libro non trovato');
 html=html.replace(oldOpen,newOpen);
 const oldRating="function askRating(id){ratingId=id;document.getElementById('remRatingTitle').textContent='Quanto ti è piaciuto «'+titles[id]+'»?';stars.replaceChildren();for(let n=1;n<=5;n++){let b=document.createElement('button');b.type='button';b.textContent='☆';b.setAttribute('aria-label',n+' stelle su 5');b.onclick=()=>{record(id).rating=n;save();overlay.hidden=true;render();};stars.append(b)}overlay.hidden=false}";
 const newRating="function askRating(id){ratingId=id;document.getElementById('remRatingTitle').textContent='Quanto ti è piaciuto «'+titles[id]+'»?';stars.replaceChildren();const current=record(id).rating||0;function paint(value){[...stars.children].forEach((b,i)=>{const full=i<value;b.textContent=full?'★':'☆';b.setAttribute('aria-pressed',String(full));b.style.color=full?'#64DFA9':'#a3b8c8'})}for(let n=1;n<=5;n++){const b=document.createElement('button');b.type='button';b.textContent='☆';b.setAttribute('aria-label',n+' stelle su 5');b.style.touchAction='manipulation';b.onclick=(event)=>{event.preventDefault();event.stopPropagation();record(id).rating=n;save();paint(n);render()};stars.append(b)}paint(current);overlay.hidden=false}";
 if(!html.includes(oldRating))throw Error('Feedback originale non trovato');
 html=html.replace(oldRating,newRating);
 html=html.replace("document.getElementById('remRatingLater').onclick=()=>overlay.hidden=true;","document.getElementById('remRatingLater').textContent='Chiudi';document.getElementById('remRatingLater').onclick=()=>overlay.hidden=true;");
 const startFn=`<script>window.REM_OPEN_FROM_START=function(){try{select(0,false)}catch(e){}const reader=document.getElementById('reader');if(reader)reader.scrollTop=0;requestAnimationFrame(()=>{const heading=reader?.querySelector('h2');if(heading)heading.scrollIntoView({block:'start',behavior:'instant'})})};<\/script>`;
 html=html.replace('</body>',startFn+'</body>');
 if(html===original)throw Error('Nessuna correzione applicata');
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('status').textContent='Impossibile avviare il test: '+e.message;}
})();
</script></body></html>
