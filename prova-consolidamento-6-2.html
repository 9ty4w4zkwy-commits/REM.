<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REM — Consolidamento 6.2</title><style>body{background:#0c1524;color:#f7f4ed;font:16px system-ui;padding:24px}#status{max-width:480px;margin:20vh auto;text-align:center}</style></head><body><div id="status">Caricamento REM — Consolidamento 6.2</div><script>
(async()=>{try{
const r=await fetch('./REM_Iterazione3_Focus_Mode.html',{cache:'no-store'});if(!r.ok)throw Error('Base '+r.status);let h=await r.text();
const patches=[
["el('libraryGrid').replaceChildren(tile(null,-1),t);","el('libraryGrid').replaceChildren(t);"],
["el('homeNew').replaceChildren(card(null,'Gratis · 3 formati'));","el('homeNew').replaceChildren();el('homeNew').closest('.home-section').hidden=true;"],
["el('homeFree').replaceChildren(card(null,'Disponibile · Gratis'),conteCard);","el('homeFree').replaceChildren(conteCard);"],
["const ids=['casa','montecristo'].sort((x,y)=>score(y,a)-score(x,a));","const ids=['montecristo'];"],
["const ids=getStarted();section.hidden=ids.length===0;","const ids=getStarted().filter(id=>id==='montecristo');section.hidden=ids.length===0;"]
];for(const [a,b] of patches){if(!h.includes(a))throw Error('Struttura modificata: '+a.slice(0,35));h=h.replace(a,b)}
h=h.replace('<title>REM — La casa oltre il bosco</title>','<title>REM — Il conte di Montecristo · Consolidamento 6.2</title>');
h=h.replace('</head>',`<style>#homeFree .home-book>img{display:block!important;width:calc(100% - 24px)!important;height:220px!important;min-height:220px!important;max-height:220px!important;object-fit:contain!important;object-position:center!important;border-radius:16px!important;clip-path:inset(0 round 16px)!important;margin:12px auto 16px!important;padding:0!important;background:transparent!important}#homeFree .home-book{display:flex!important;flex-direction:column!important}#remPicksRail .rem-pick img{border-radius:16px!important;clip-path:inset(0 round 16px)!important}#switchContinueRail img{border-radius:14px!important}</style></head>`);
document.open();document.write(h);document.close();
const ep=document.createElement('script');ep.src='./rem-episodi-v5-6.js?v=60';document.body.appendChild(ep);

// Restore the Montecristo cover in the personalized rail using a working cover elsewhere on the page.
const fixCover=()=>{
 const target=document.querySelector('#remPicksRail img, #homeRecommendations img, #homeRecommended img, #remRecommendations img');
 const candidates=[...document.querySelectorAll('#switchContinueRail img, #homeFree img, #libraryGrid img')];
 const source=candidates.find(im=>im.complete&&im.naturalWidth>0&&im.currentSrc);
 if(target&&source&&(target.naturalWidth===0||!target.getAttribute('src'))){
   target.src=source.currentSrc;
   target.style.cssText+=';display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;border-radius:16px!important';
 }
};
fixCover();
let coverTries=0;const coverInterval=setInterval(()=>{fixCover();if(++coverTries>=30)clearInterval(coverInterval)},350);

}catch(e){document.getElementById('status').textContent='Errore nel consolidamento: '+e.message}})();
</script></body></html>
