name: REM browser smoke
on:
  push:
    branches: [rem-lab-modularizzazione-v1]
    paths:
      - 'lab/**'
      - 'rem-modulare-demo.html'
      - 'rem-candidata.html'
      - '.github/workflows/rem-browser-smoke.yml'
  workflow_dispatch:
concurrency:
  group: rem-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (use runner Chrome)
        run: npm install --no-save playwright
      - name: Start static server and test mobile viewport
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rem-http.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8765/rem-modulare-demo.html >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:8765/rem-modulare-demo.html >/dev/null
          node lab/tests/browser-smoke.mjs
          node lab/tests/browser-candidate.mjs
          node lab/tests/capture-candidate.mjs
      - name: Upload candidate screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-candidate-iphone-screens
          path: lab/visual-review/*.png
          if-no-files-found: ignore
          node lab/tests/capture-candidate.mjs
      - name: Upload candidate screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rem-candidate-iphone-screens
          path: lab/visual-review/*.png
          if-no-files-found: ignore
